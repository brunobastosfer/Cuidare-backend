name: Qualidade e segurança

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: cuidare_test
          POSTGRES_PASSWORD: ci-only-local-password
          POSTGRES_DB: cuidare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cuidare_test -d cuidare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cuidare_test:ci-only-local-password@localhost:5432/cuidare_test
      TEST_DATABASE_URL: postgresql://cuidare_test:ci-only-local-password@localhost:5432/cuidare_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run env:setup
      - run: npm ci
      - run: npm run validate
      - run: npm audit --audit-level=high
      - run: npm run prisma:deploy
      - run: npm run test:database
