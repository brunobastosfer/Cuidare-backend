name: cuidare-backend
services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Execute npm run env:setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run env:setup}
      POSTGRES_DB: ${POSTGRES_DB:?Execute npm run env:setup}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - '127.0.0.1:${DB_PORT:-5434}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
volumes:
  postgres_data:
